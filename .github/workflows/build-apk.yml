name: Build ProfitMirror APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Create app
        run: |
          mkdir -p app/src/main/java/com/profitmirror/app
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='ProfitMirror'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.profitmirror.app'
            compileSdk 35
            defaultConfig {
              applicationId "com.profitmirror.app"
              minSdk 24
              targetSdk 35
              versionCode 1
              versionName "0.1"
            }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="ProfitMirror" android:theme="@style/AppTheme">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
            <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
              <item name="android:statusBarColor">#111315</item>
              <item name="android:navigationBarColor">#111315</item>
              <item name="android:windowLightStatusBar">false</item>
            </style>
          </resources>
          EOF

          cat > app/src/main/java/com/profitmirror/app/MainActivity.java <<'EOF'
          package com.profitmirror.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.view.View;
          import android.widget.*;

          public class MainActivity extends Activity {
            LinearLayout root, page;
            TextView title;

            TextView txt(String s, int sp, boolean bold) {
              TextView t=new TextView(this);
              t.setText(s); t.setTextSize(sp); t.setTextColor(Color.rgb(20,20,20));
              t.setPadding(0,10,0,10);
              if(bold) t.setTypeface(null,1);
              return t;
            }

            Button nav(String s, View.OnClickListener c) {
              Button b=new Button(this); b.setText(s); b.setOnClickListener(c); return b;
            }

            EditText input(String label, String value) {
              EditText e=new EditText(this); e.setHint(label); e.setText(value); e.setTextSize(18); return e;
            }

            void showDash() {
              page.removeAllViews();
              page.addView(txt("MONTHLY SNAPSHOT",12,true));
              page.addView(txt("Busy doesn’t always mean profitable.",30,true));
              String[] a={"Profit health 72/100","Revenue $18,750","Operating profit $5,430","Profit margin 28.9%","Utilization 68%","Avg ticket $79.50","Rebooking 62%","No-show impact $830"};
              for(String s:a){
                TextView c=txt(s,20,true);
                c.setBackgroundColor(Color.WHITE);
                c.setPadding(20,18,20,18);
                page.addView(c);
              }
              page.addView(txt("Potential profit opportunities",18,true));
              page.addView(txt("• Review lowest profit/hour service\n• Reduce no-shows\n• Improve utilization\n• Test one What-If scenario",16,false));
            }

            void showSetup() {
              page.removeAllViews();
              page.addView(txt("Business setup",28,true));
              page.addView(input("Monthly rent","1800"));
              page.addView(input("Utilities","350"));
              page.addView(input("Software","180"));
              page.addView(input("Marketing","500"));
              page.addView(input("Target utilization %","75"));
              page.addView(input("Target rebooking %","55"));
            }

            void showServices() {
              page.removeAllViews();
              page.addView(txt("Services",28,true));
              String[] s={"Gel Manicure — $45 — 75 min","Structured Gel — $65 — 105 min","Gel-X Full Set — $85 — 120 min","Nail Art Add-on — $20 — 20 min"};
              for(String x:s) page.addView(txt(x,17,true));
            }

            void showWhatIf() {
              page.removeAllViews();
              page.addView(txt("What-If",28,true));
              page.addView(txt("Price change +10%",18,true));
              SeekBar a=new SeekBar(this); a.setProgress(40); page.addView(a);
              page.addView(txt("Client volume +5%",18,true));
              SeekBar b=new SeekBar(this); b.setProgress(25); page.addView(b);
              page.addView(txt("Projected profit: $7,180",24,true));
            }

            void showAudit() {
              page.removeAllViews();
              page.addView(txt("30-second audit",28,true));
              page.addView(input("Revenue","15000"));
              page.addView(input("Expenses","9500"));
              page.addView(input("Booked hours","165"));
              page.addView(input("Available hours","240"));
              page.addView(txt("Result: $5,500 profit · 69% utilized",22,true));
            }

            @Override public void onCreate(Bundle b) {
              super.onCreate(b);
              root=new LinearLayout(this); root.setOrientation(LinearLayout.VERTICAL); root.setPadding(18,18,18,18); root.setBackgroundColor(Color.rgb(247,243,235));
              TextView brand=txt("PROFITMIRROR™\nNail Profit Engine",22,true); brand.setTextColor(Color.WHITE); brand.setBackgroundColor(Color.rgb(17,19,21)); brand.setPadding(18,18,18,18); root.addView(brand);

              HorizontalScrollView hs=new HorizontalScrollView(this);
              LinearLayout navs=new LinearLayout(this); navs.setOrientation(LinearLayout.HORIZONTAL);
              navs.addView(nav("Dashboard",v->showDash()));
              navs.addView(nav("Setup",v->showSetup()));
              navs.addView(nav("Services",v->showServices()));
              navs.addView(nav("What-If",v->showWhatIf()));
              navs.addView(nav("Audit",v->showAudit()));
              hs.addView(navs); root.addView(hs);

              ScrollView sv=new ScrollView(this);
              page=new LinearLayout(this); page.setOrientation(LinearLayout.VERTICAL); page.setPadding(10,14,10,30);
              sv.addView(page); root.addView(sv,new LinearLayout.LayoutParams(-1,0,1));
              setContentView(root); showDash();
            }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProfitMirror-APK
          path: app/build/outputs/apk/debug/app-debug.apk
